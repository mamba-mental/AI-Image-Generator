<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Studio Void: Generation Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8B5CF6",
                        "background-light": "#f6f5f8",
                        "background-dark": "#000000",
                        "panel-dark": "#0a0a0a",
                        "card-dark": "#111111",
                        "border-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: "Space Grotesk", sans-serif; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #8B5CF6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #2a2a2a; border-radius: 2px; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between border-b border-border-dark bg-panel-dark px-6 py-3 shrink-0 h-14">
<div class="flex items-center gap-4 text-slate-100">
<span class="material-symbols-outlined text-primary">auto_awesome</span>
<h2 class="text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em]">AI Studio Void</h2>
</div>
<div class="flex items-center gap-4">
<button class="text-slate-400 hover:text-slate-100 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex flex-1 overflow-hidden">
<!-- Left Control Panel -->
<aside class="w-[380px] bg-panel-dark border-r border-border-dark flex flex-col flex-shrink-0 h-full overflow-y-auto">
<div class="p-4 space-y-6 flex-1">
<!-- Service Toggle -->
<div class="flex h-10 w-full items-center justify-center rounded-lg bg-card-dark p-1 border border-border-dark">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-[#1e1e1e] has-[:checked]:text-primary text-slate-400 text-sm font-medium transition-colors">
<span class="truncate">Replicate</span>
<input checked="" class="invisible w-0" name="service" type="radio" value="Replicate"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-[#1e1e1e] has-[:checked]:text-primary text-slate-400 text-sm font-medium transition-colors">
<span class="truncate">Fal.ai</span>
<input class="invisible w-0" name="service" type="radio" value="Fal.ai"/>
</label>
</div>
<!-- Model Selector -->
<label class="flex flex-col gap-2">
<span class="text-slate-300 text-sm font-medium">Model</span>
<div class="relative">
<select class="form-input flex w-full appearance-none rounded-lg text-slate-100 focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-card-dark h-10 px-3 text-sm font-medium">
<option value="sdxl">Stable Diffusion XL 1.0</option>
<option value="sd15">Stable Diffusion 1.5</option>
<option value="kandinsky">Kandinsky 2.2</option>
</select>
</div>
</label>
<!-- Prompt Input -->
<label class="flex flex-col gap-2">
<span class="text-slate-300 text-sm font-medium">Prompt</span>
<textarea class="form-input mono flex w-full resize-y rounded-lg text-slate-100 focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-card-dark min-h-[120px] placeholder:text-slate-600 p-3 text-sm leading-relaxed" placeholder="Enter your prompt here..."></textarea>
</label>
<!-- Negative Prompt Input -->
<label class="flex flex-col gap-2">
<span class="text-slate-300 text-sm font-medium flex justify-between items-center">Negative Prompt <span class="text-xs text-slate-500 font-normal">Optional</span></span>
<textarea class="form-input mono flex w-full resize-y rounded-lg text-slate-100 focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-card-dark min-h-[80px] placeholder:text-slate-600 p-3 text-sm leading-relaxed" placeholder="ugly, blurry, poor quality..."></textarea>
</label>
<!-- Parameter Group Card -->
<div class="rounded-lg border border-border-dark bg-card-dark p-4 space-y-5">
<div class="flex items-center justify-between pb-2 border-b border-border-dark">
<h3 class="text-slate-200 text-sm font-medium">Parameters</h3>
<button class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1">Reset</button>
</div>
<!-- Aspect Ratio -->
<label class="flex flex-col gap-2">
<span class="text-slate-400 text-xs font-medium">Aspect Ratio</span>
<select class="form-input flex w-full appearance-none rounded text-slate-200 focus:outline-none focus:ring-1 focus:ring-primary border border-[#2a2a2a] bg-[#1a1a1a] h-9 px-3 text-sm">
<option>1024 x 1024 (1:1)</option><option>1024 x 768 (4:3)</option><option>768 x 1024 (3:4)</option><option>1216 x 832 (16:9)</option>
</select>
</label>
<!-- Steps Slider -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-slate-400 text-xs font-medium">Steps</span>
<span class="text-slate-200 text-xs mono bg-[#1a1a1a] px-2 py-0.5 rounded border border-[#2a2a2a]">30</span>
</div>
<input class="w-full" max="50" min="1" type="range" value="30"/>
</div>
<!-- Guidance Scale Slider -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-slate-400 text-xs font-medium">Guidance Scale</span>
<span class="text-slate-200 text-xs mono bg-[#1a1a1a] px-2 py-0.5 rounded border border-[#2a2a2a]">7.5</span>
</div>
<input class="w-full" max="20" min="1" step="0.1" type="range" value="7.5"/>
</div>
<!-- Seed -->
<label class="flex flex-col gap-2">
<span class="text-slate-400 text-xs font-medium">Seed</span>
<input class="form-input mono flex w-full rounded text-slate-200 border border-[#2a2a2a] bg-[#1a1a1a] h-9 px-3 text-sm placeholder:text-slate-600" placeholder="Random (-1)" type="text"/>
</label>
</div>
</div>
<!-- Generate Button -->
<div class="p-4 bg-panel-dark border-t border-border-dark sticky bottom-0 z-10">
<button class="w-full h-12 bg-primary hover:bg-[#7c3aed] text-white font-bold rounded-lg transition-colors flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(139,92,246,0.3)]">GENERATE</button>
<div class="h-1 w-full bg-[#1a1a1a] rounded-full mt-3 overflow-hidden hidden">
<div class="h-full bg-primary w-1/3 animate-pulse"></div>
</div>
</div>
</aside>
<!-- Right Gallery Panel -->
<section class="flex-1 bg-background-dark flex flex-col relative">
<div class="flex-1 flex items-center justify-center p-8 overflow-hidden relative">
<div class="relative group max-h-full max-w-full flex flex-col items-center">
<div class="relative rounded-lg overflow-hidden border border-border-dark shadow-2xl bg-card-dark">
<img alt="AI Generated" class="max-h-[65vh] w-auto object-contain" src="placeholder.png"/>
<div class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="bg-black/60 hover:bg-black/80 text-white p-2 rounded backdrop-blur-sm border border-white/10">Download</button>
<button class="bg-black/60 hover:bg-black/80 text-white p-2 rounded backdrop-blur-sm border border-white/10">Upscale</button>
</div>
</div>
<div class="mt-4 flex flex-wrap gap-4 text-xs text-slate-500 w-full max-w-3xl justify-center bg-card-dark/50 p-2 rounded border border-border-dark">
<div>1024 x 1024</div><div>Seed: 482910483</div><div>4.2s</div><div>Steps: 30, CFG: 7.5</div>
</div>
</div>
</div>
<!-- Thumbnail Strip -->
<div class="h-32 border-t border-border-dark bg-[#050505] p-4 flex gap-3 overflow-x-auto items-center shrink-0">
<div class="h-20 w-20 shrink-0 rounded border-2 border-primary overflow-hidden cursor-pointer">
<div class="w-full h-full bg-card-dark"></div>
</div>
<div class="h-20 w-20 shrink-0 rounded border border-border-dark overflow-hidden cursor-pointer opacity-70 hover:opacity-100">
<div class="w-full h-full bg-card-dark"></div>
</div>
<button class="h-20 w-20 shrink-0 rounded border border-dashed border-[#333] flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 bg-[#0a0a0a]">History</button>
</div>
</section>
</main>
<!-- Bottom Status Bar -->
<footer class="h-8 bg-panel-dark border-t border-border-dark flex items-center justify-between px-4 text-[11px] text-slate-500 shrink-0 font-mono">
<div class="flex items-center gap-4">
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-emerald-500"></div>
<span class="text-slate-400">Connected to Replicate</span>
</div>
<span>v2.4.1</span>
</div>
<div class="flex items-center gap-4">
<span>SDXL 1.0 Loaded</span>
<span class="text-slate-400">Cost: $0.002 / gen</span>
</div>
</footer>
</body></html>
